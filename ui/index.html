<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'"><title>遗物助手</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand">◇ <b>遗物助手</b><span>RELIC ASSISTANT</span></div><div class="controls"><button id="pin" title="打开独立精简窗口并置顶；空白处右键返回正常窗口">精简置顶</button><button id="min" title="最小化">−</button><button id="max" title="最大化 / 还原">□</button><button id="close" title="关闭">×</button></div></header>
<main><section class="intro"><div><small>你的虚空收藏</small><h1>遗物清单 <span id="total">0</span></h1></div><div class="actions"><button id="settings-toggle" aria-expanded="false">设置</button><button id="import">导入备份</button><button id="export">导出备份</button></div></section>
<section id="settings" hidden><label for="opacity">精简窗口不透明度</label><input id="opacity" type="range" min="20" max="100" step="1" value="100"><output id="opacity-value" for="opacity">100%</output><span>数值越低越透明</span></section>
<form id="add"><div class="choices-row"><div class="choice-group" id="categories" role="group" aria-label="纪元"><button type="button" data-category="古纪" aria-pressed="true" class="selected">古纪</button><button type="button" data-category="前纪" aria-pressed="false">前纪</button><button type="button" data-category="中纪" aria-pressed="false">中纪</button><button type="button" data-category="后纪" aria-pressed="false">后纪</button></div><div class="choice-group" id="colors" role="group" aria-label="标记颜色"><span class="choice-label">颜色</span><button type="button" data-color="common" aria-pressed="true" class="common selected">● 铜色</button><button type="button" data-color="uncommon" aria-pressed="false" class="uncommon">● 银色</button><button type="button" data-color="rare" aria-pressed="false" class="rare">● 金色</button></div></div><div class="entry-row"><input id="text" maxlength="200" placeholder="输入遗物名称，例如：A1 光辉" aria-label="遗物名称" required><button class="primary" id="submit" type="submit">＋ 添加遗物</button></div></form>
<section id="columns" class="columns"></section></main>
<footer><span>单击复制 · 双击删除 · 右键切换颜色</span><span id="status" role="status" aria-live="polite">正在加载…</span><button id="undo" hidden>撤销删除</button></footer><script src="renderer.js"></script></body></html>
